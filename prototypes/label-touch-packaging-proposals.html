    if(op==='+') return left+right;
    if(op==='−') return left-right;
    if(op==='×') return left*right;
    if(op==='÷') return right===0?NaN:left/right;
    return right;
  }
  const screens=[];
  for(const proposal of root.querySelectorAll('.dp-proposal')){
    const screen=proposal.querySelector('.dp-screen'),layout=proposal.dataset.layout;
    const state={job:0,scale:{value:2.48,status:'stable'},records:jobs.map(job=>({production:job.production,inner:job.inner,outer:job.outer,complete:false,last:null,innerSettings:{weight:job.innerWeight,copies:1,mode:'fixed'},outerSettings:{weight:job.outerWeight,copies:1,mode:'scale'}})),calc:{value:'0',stored:null,op:null,fresh:false},edit:null};
    const record=()=>state.records[state.job];
    const settings=kind=>record()[`${kind}Settings`];
    const notify=text=>{screen.querySelector('.dp-status').textContent=text;};
    const scaleReady=()=>state.scale.status==='stable'&&Number.isFinite(state.scale.value)&&state.scale.value>0;
    const scaleStatus=()=>({stable:state.scale.value>0?'안정 · 예시':'0 kg · 출력 대기',moving:'흔들림 · 계근 출력 대기',offline:'연결 끊김 · 출력 불가'}[state.scale.status]);
    const outputWeight=kind=>settings(kind).mode==='scale'?(scaleReady()?state.scale.value:null):settings(kind).weight;
    const outputCopies=kind=>settings(kind).mode==='scale'?1:settings(kind).copies;
    function scaleMarkup(){
      return button(`<span>현재 계근중량</span><strong data-metric="scale">${state.scale.status==='offline'?'—':state.scale.value.toFixed(2)}<small>kg</small></strong><span class="dp-scale-state">${scaleStatus()}</span>`,'scale','dp-scale-readout','aria-label="계근중량 시연 설정"');
    }
    function printButton(kind){
      const weight=outputWeight(kind),copies=outputCopies(kind);
      const disabled=(kind==='outer'&&record().complete)||weight===null?'disabled':'';
      return button(`<span>${packName(kind)}라벨출력</span><small>${weight===null?'계근중량 확인 대기':`${copies}장 · ${kind==='inner'?'생산 집계 제외':`생산 +${number(weight*copies)} kg`}`}</small>`,'print','dp-print',`data-kind="${kind}" ${disabled}`);
    }
    function packageMarkup(kind){
      const s=settings(kind),inner=kind==='inner',scale=s.mode==='scale',weight=outputWeight(kind),copies=outputCopies(kind),lock=scale?'disabled':'';
      return `<section class="dp-panel dp-pack" data-kind="${kind}" aria-label="${packName(kind)} 라벨 설정">
        <div class="dp-pack-head"><div><div class="dp-pack-title">${packName(kind)} ${inner?'· 진공지':'· 박스'}</div><span class="dp-rule">${inner?'생산량에 포함하지 않음':'외포장 출력만 생산량에 포함'}</span></div>${layout!=='rows'?button('미리보기','preview','dp-preview',`data-kind="${kind}" aria-label="${packName(kind)} 라벨 미리보기"`):''}</div>
        <div class="dp-fields">
          <div class="dp-mode">${button('고정중량','mode','',`data-kind="${kind}" data-mode="fixed" aria-pressed="${!scale}" aria-label="${packName(kind)} 고정중량"`)}${button('계근중량','mode','',`data-kind="${kind}" data-mode="scale" aria-pressed="${scale}" aria-label="${packName(kind)} 계근중량"`)}</div>
          <div><div class="dp-field-label"><span>라벨 적용 중량</span><span class="dp-small">${scale?'저울에서 자동':'터치 입력'}</span></div>${scale?`<div class="dp-weight dp-weight-live" data-applied="${kind}" role="status" aria-label="${packName(kind)} 라벨 계근중량"><strong>${weight===null?'—':weight.toFixed(2)}</strong><small>kg</small></div>`:button(`<strong>${s.weight.toFixed(2)}</strong><small>kg</small>`,'edit','dp-weight',`data-kind="${kind}" data-field="weight" aria-label="${packName(kind)} 중량 수정"`)}
          </div>
          <div><div class="dp-field-label"><span>출력 매수</span><span class="dp-small">${scale?'계근당 1장':'장'}</span></div><div class="dp-stepper">${button('−','adjust','dp-adjust',`data-kind="${kind}" data-delta="-1" aria-label="${packName(kind)} 매수 줄이기" ${lock}`)}${button(copies,'edit','dp-count',`data-kind="${kind}" data-field="copies" aria-label="${packName(kind)} 매수 입력" ${lock}`)}${button('+','adjust','dp-adjust',`data-kind="${kind}" data-delta="1" aria-label="${packName(kind)} 매수 늘리기" ${lock}`)}</div><div class="dp-effect">${weight===null?'저울 상태 확인 필요':scale?'출력 시 안정 중량 사용':inner?'생산량 추가 없음':`생산량 +${number(weight*copies)} kg`}</div></div>
        </div>
        <div class="dp-pack-bottom">${printButton(kind)}${button('라벨 미리보기','preview','dp-preview',`data-kind="${kind}"`)}</div>
      </section>`;
    }
    function renderWork(){
      const job=jobs[state.job],r=record();
      screen.querySelector('.dp-job').innerHTML=`<div class="dp-job-head"><div><div class="dp-product">${job.name}</div><div class="dp-small">작업 ${String(state.job+1).padStart(2,'0')} · ${job.origin}<br>LOT ${job.lot} · 70 × 100 mm</div></div>${layout==='rows'?'':`<div class="dp-scale-home">${scaleMarkup()}</div>`}</div><div class="dp-metrics"><div><span class="dp-small">원료 투입중량</span><strong>${number(job.input)} kg</strong></div><div><span class="dp-small">외포장 기준 생산량</span><strong data-metric="production">${number(r.production)} kg</strong></div><div><span class="dp-small">외포장 출력 수</span><strong data-metric="outer">${r.outer}장</strong></div></div>`;
      screen.querySelector('.dp-left > .dp-scale-home').innerHTML=layout==='rows'?scaleMarkup():'';
      screen.querySelector('.dp-pack-area').innerHTML=packageMarkup('inner')+packageMarkup('outer')+`<div class="dp-dock">${printButton('inner')}${printButton('outer')}</div>`;
      const last=r.last;
      screen.querySelector('.dp-bottom').innerHTML=`<div class="dp-last"><span>내포장 인쇄 <strong data-metric="inner">${r.inner}장</strong> · 집계 제외</span><span class="dp-small">${last?`최근 ${packName(last.kind)} · ${number(last.weight)} kg × ${last.copies}장`:'최근 외포장 · '+number(job.outerWeight)+' kg × 1장'}</span>${button('재출력','reprint','','aria-label="최근 라벨 재출력"')}</div><div class="dp-complete"><div><strong>전송 ${number(r.production)} kg</strong><span class="dp-small">외포장 생산량만</span></div>${button(r.complete?'전송 완료 · 시연':'생산완료 · 전송','complete','',r.complete?'disabled':'')}</div>`;
      for(const item of screen.querySelectorAll('.dp-order')) item.setAttribute('aria-pressed',String(Number(item.dataset.job)===state.job));
    }
    let focusBefore;
    function closeDialog(){screen.querySelector('.dp-overlay')?.remove();state.edit=null;if(focusBefore?.isConnected)focusBefore.focus();}
    function dialog(title,body,actions){
      closeDialog();focusBefore=document.activeElement;
      const overlay=document.createElement('div');overlay.className='dp-overlay';
      overlay.innerHTML=`<section class="dp-dialog" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3>${body}<div class="dp-error" role="alert"></div><div class="dp-dialog-actions">${actions}</div></section>`;
      screen.appendChild(overlay);overlay.querySelector('input,select,button')?.focus();
      overlay.addEventListener('keydown',event=>{
        if(event.key==='Escape'){closeDialog();return;}
        if(event.key!=='Tab')return;
        const items=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')];
        if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}
        else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}
      });
    }
    const calcKeys=['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
    screen.innerHTML=`<header class="dp-top"><span class="dp-brand">동부엠티 ERP · 라벨 출력</span><span class="dp-demo">1280 × 1024 · 시안</span>${button('저울 설정','scale')}${button('전체화면','fullscreen')}</header>
      <div class="dp-body"><aside class="dp-left"><section class="dp-panel"><div class="dp-heading">작업지시 <span class="dp-small">2건 · 예시</span></div><label class="dp-date"><span class="dp-small">작업일</span><input type="date" value="2026-09-15" aria-label="시안 작업일"></label><div class="dp-orders">${jobs.map((job,i)=>button(`${job.name}<span class="dp-small">투입 ${number(job.input)} kg · ${job.origin}</span>`,'job','dp-order',`data-job="${i}" aria-pressed="${i===0}"`)).join('')}</div></section><div class="dp-scale-home"></div>
      <section class="dp-panel dp-calc" aria-label="터치 계산기"><div class="dp-heading">계산기 <span class="dp-small">독립 계산</span></div><output class="dp-calc-output" aria-label="계산 결과" aria-live="polite">0</output><div class="dp-calc-keys">${calcKeys.map(key=>button(key,'calc',key==='='?'dp-dark':'',`data-key="${key}" aria-label="계산기 ${key}"`)).join('')}</div></section></aside>
      <main class="dp-right"><section class="dp-panel dp-job"></section><div class="dp-pack-area"></div><section class="dp-panel dp-bottom"></section></main></div>
      <footer class="dp-status" role="status" aria-live="polite">시안입니다. 버튼을 눌러도 실제 인쇄·저장·전송은 하지 않습니다.</footer>`;
    renderWork();
    screen.addEventListener('change',event=>{if(event.target.matches('input[type="date"]'))notify('날짜 선택 시연입니다. 작업목록은 예시 데이터입니다.');});
    screen.addEventListener('click',event=>{
      const target=event.target.closest('button[data-action]');if(!target||target.disabled)return;
      const action=target.dataset.action,kind=target.dataset.kind;
      if(action==='close'){closeDialog();return;}
      if(action==='job'){state.job=Number(target.dataset.job);renderWork();notify('작업을 변경했습니다. 시연 출력 수는 작업별로 유지됩니다.');return;}
      if(action==='mode'){settings(kind).mode=target.dataset.mode;renderWork();notify(`${packName(kind)} ${settings(kind).mode==='scale'?'계근중량 · 안정 중량으로 1장씩 출력':'고정중량 · 직접 입력값 사용'} 시연`);return;}
      if(action==='preset'){settings(kind).weight=Number(target.dataset.value);renderWork();return;}
      if(action==='adjust'){const s=settings(kind);s.copies=Math.max(1,Math.min(500,s.copies+Number(target.dataset.delta)));renderWork();return;}
      if(action==='edit'){
        const field=target.dataset.field;
        dialog(`${packName(kind)} ${field==='weight'?'1장 중량 (kg)':'출력 매수 (장)'}`,`<input type="text" inputmode="decimal" value="${settings(kind)[field]}" aria-label="라벨 숫자 입력"><div class="dp-keypad">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(key=>button(key,'key','','data-key="'+key+'"')).join('')}</div>`,button('취소','close')+button('적용','apply','dp-dark'));
        state.edit={kind,field,fresh:true};screen.querySelector('.dp-dialog input').select();return;
      }
      if(action==='key'){
        const input=screen.querySelector('.dp-dialog input'),key=target.dataset.key;
        if(state.edit.fresh){input.value='';state.edit.fresh=false;}
        if(key==='⌫')input.value=input.value.slice(0,-1);
        else if(input.value.length<9&&(key!=='.'||!input.value.includes('.')))input.value+=key;
        return;
      }
      if(action==='apply'){
        const {kind:editKind,field}=state.edit,text=screen.querySelector('.dp-dialog input').value,value=Number(text);
        const valid=Number.isFinite(value)&&value>0&&(field==='copies'?Number.isInteger(value)&&value<=500:/^\d+(\.\d{1,2})?$/.test(text)&&value<=1000);
        if(!valid){screen.querySelector('.dp-error').textContent=field==='copies'?'매수는 1~500 사이의 정수로 입력하세요.':'중량은 0 초과, 1,000 kg 이하, 소수 둘째 자리까지 입력하세요.';return;}
        settings(editKind)[field]=value;closeDialog();renderWork();return;
      }
      if(action==='print'){
        const r=record(),weight=outputWeight(kind),copies=outputCopies(kind);if((kind==='outer'&&r.complete)||weight===null)return;
        r[kind]+=copies;r.last={kind,weight,copies,mode:settings(kind).mode};
        if(kind==='outer')r.production=Number((r.production+weight*copies).toFixed(2));
        renderWork();notify(`${packName(kind)} ${number(weight)} kg × ${copies}장 시연 · ${kind==='inner'?'생산량 변동 없음':`생산량 +${number(weight*copies)} kg`} · 실제 인쇄 없음`);return;
      }
      if(action==='reprint'){const last=record().last;notify(`최근 라벨 ${number(last?last.weight:jobs[state.job].outerWeight)} kg 재출력 시연 · 생산량 및 출력 수 추가 없음 · 실제 인쇄 없음`);return;}
      if(action==='preview'){
        const weight=outputWeight(kind);
        dialog(`${packName(kind)} 라벨 미리보기 · 시안`,`<div class="dp-proof"><div>${jobs[state.job].name}</div><div>원산지 ${jobs[state.job].origin}</div><div>중량 ${weight===null?'계근 대기':weight.toFixed(2)+' kg'}</div><div>이력번호 ${jobs[state.job].lot}</div><span>주식회사 동부엠티</span></div><div class="dp-small">내용 확인용 시안 · 실제 라벨 서식 유지 · 계근은 출력 시점의 안정값 사용</div>`,button('닫기','close'));return;
      }
      if(action==='complete'){
        dialog('생산일보 전송 · 시연',`<div>${jobs[state.job].name}</div><div>외포장 생산량 <strong>${number(record().production)} kg</strong></div><div>내포장 ${record().inner}장 · 전송량에서 제외</div><div class="dp-small">실제 ERP에는 전송되지 않습니다.</div>`,button('취소','close')+button('전송 시연','confirm','dp-dark'));return;
      }
      if(action==='confirm'){record().complete=true;closeDialog();renderWork();notify('전송 시연 완료 · 내포장 추가 출력은 계속 가능 · 실제 ERP 변경 없음');return;}
      if(action==='scale'){dialog('계근중량 시연 설정',`<div class="dp-small">A&amp;D FG-150KAL · COM2 / 2400 / 7E1<br>실제 저울 미연결 · 아래 값은 시안용입니다.</div><div class="dp-sim-fields"><label>시연 중량 (kg)<input type="number" min="0" max="150" step="0.02" value="${state.scale.value}" aria-label="시연 중량"></label><label>시연 수신 상태<select aria-label="시연 수신 상태">${[['stable','안정'],['moving','흔들림'],['offline','연결 끊김']].map(([value,label])=>`<option value="${value}" ${state.scale.status===value?'selected':''}>${label}</option>`).join('')}</select></label></div>`,button('취소','close')+button('시연 적용','apply-scale','dp-dark'));return;}
      if(action==='apply-scale'){
        const value=Number(screen.querySelector('[aria-label="시연 중량"]').value),status=screen.querySelector('[aria-label="시연 수신 상태"]').value;
        if(!Number.isFinite(value)||value<0||value>150){screen.querySelector('.dp-error').textContent='시연값은 0~150 kg 범위로 입력하세요.';return;}
        state.scale={value:Number(value.toFixed(2)),status};closeDialog();renderWork();notify('계근 시연값을 변경했습니다. 실제 저울을 읽거나 설정하지 않았습니다.');return;
      }
      if(action==='size'){notify('시안 용지 70 × 100 mm · 실제 라벨 크기와 인쇄 설정은 변경하지 않습니다.');return;}
      if(action==='fullscreen'){notify('전체화면 버튼 위치 시안 · 1280×1024 기준 배치입니다.');return;}
      if(action==='calc'){
        const c=state.calc,key=target.dataset.key,format=n=>Number.isFinite(n)?String(Number(n.toPrecision(10))):'오류';
        if(key==='AC'){Object.assign(c,{value:'0',stored:null,op:null,fresh:false});}
        else{
          if(!Number.isFinite(Number(c.value)))Object.assign(c,{value:'0',stored:null,op:null,fresh:false});
          if(/^[0-9.]$/.test(key)){
            if(c.fresh){c.value='0';c.fresh=false;}
            if(key==='.'){if(!c.value.includes('.'))c.value+='.';}
            else if(c.value.replace(/[-.]/g,'').length<10)c.value=c.value==='0'?key:c.value+key;
          }else if(key==='⌫'){c.value=c.value.slice(0,-1)||'0';if(c.value==='-')c.value='0';}
          else if(key==='%')c.value=format(Number(c.value)/100);
          else if(key==='='){if(c.op&&c.stored!==null)c.value=format(calculate(c.stored,Number(c.value),c.op));c.op=null;c.stored=null;c.fresh=true;}
          else{if(c.op&&!c.fresh)c.value=format(calculate(c.stored,Number(c.value),c.op));c.stored=Number(c.value);c.op=key;c.fresh=true;}
        }
        screen.querySelector('.dp-calc-output').textContent=c.value;
      }
    });
    screen.addEventListener('input',event=>{if(event.target.matches('.dp-dialog input')&&state.edit)state.edit.fresh=false;});
    screens.push({proposal,screen});
  }
  function renderDesign(){for(const {proposal,screen} of screens){proposal.hidden=designs.view!=='all'&&proposal.dataset.layout!==designs.view;screen.style.setProperty('--dp-target',`${designs.touch/12.8}cqi`);}}
  renderDesign();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:renderDesign});
    tweak.addSelect(designs,'view',{label:'비교할 배치',options:[{label:'3안 모두',value:'all'},{label:'1안 · 균형형',value:'split'},{label:'2안 · 작업 분리형',value:'rows'},{label:'3안 · 계근 집중형',value:'dock'}]});
    tweak.addSlider(designs,'touch',{label:'일반 버튼 높이 · 1280 기준',min:60,max:64,step:4,unit:'px'});
  }
})();
</script>
