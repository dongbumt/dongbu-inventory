<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>동부엠티 ERP · PDA 원료육 입출고</title>
  <link rel="stylesheet" href="styles/pda.css?v=20261013pda1">
  <link rel="stylesheet" href="styles/pda-kind.css?v=20261021raw1">
  <script src="vendor/gs1-parser/BarcodeParser.min.js?v=9989caa6" defer></script>
  <script src="pda-sound.js?v=20261014sound2" defer></script>
  <script src="pda-raw.js?v=20261022trace1" defer></script>
</head>
<body>
  <header class="pda-header"><div class="brand"><img src="assets/company-logo.png" alt="동부엠티" width="30" height="30"><div><strong>동부엠티 ERP</strong><h1 class="pda-kind-mini" aria-label="입출고 품목구분"><a href="pda.html">제품</a><span aria-current="page">원료육</span></h1></div></div><div class="header-actions"><span id="user-name"></span><button id="history-open" type="button" hidden>이력</button><button id="logout" type="button" hidden>로그아웃</button></div></header>
  <main>
    <div id="status" role="status" aria-live="polite"></div>
    <form id="login-form" class="login-form">
      <h2>ERP 사용자 로그인</h2>
      <label for="login-id">아이디</label><input id="login-id" name="username" autocomplete="username" maxlength="30" required>
      <label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{4}" maxlength="4" required>
      <button class="primary" id="login-submit" type="submit">로그인</button>
    </form>
    <section id="workspace" hidden>
      <fieldset class="mode-tabs"><legend class="sr-only">작업구분</legend><label><input type="radio" name="mode" value="inbound" checked><span>입고</span></label><label><input type="radio" name="mode" value="outbound"><span>출고</span></label></fieldset>
      <details id="settings-panel" open><summary id="settings-summary">작업 설정</summary><div class="settings">
        <label>작업일<input type="date" id="work-date" required></label><label>재고 지점<select id="location" required></select></label>
        <div class="partner-fields" id="partner-fields"><label><span id="partner-label">입고 거래처</span><input type="search" id="partner-search" placeholder="거래처명 검색" autocomplete="off"></label><select id="partner" aria-label="거래처"><option value="">거래처 선택</option></select></div>
        <label class="raw-wide">판독형식<select id="rule"><option value="">GS1·사진 검증 국내산 자동</option></select></label>
        <div id="inbound-fields" class="raw-wide settings">
          <label>입고 방식<select id="receive-kind"><option value="new">신규 입고</option><option value="bind">기존 재고 연결</option></select></label>
          <label id="price-field">입고 단가(원/KG)<input id="unit-price" type="number" min="0" max="1000000000" step="any" inputmode="decimal" value="0"></label>
          <label class="raw-wide">원료육 품목<input id="product-search" type="search" autocomplete="off" placeholder="품목·브랜드·공장번호 검색"></label>
          <select class="raw-wide" id="product" aria-label="원료육 품목"><option value="">품목 선택</option></select>
          <div id="product-meta" class="raw-product-meta"></div>
          <label class="raw-wide" id="source-field" hidden>기존 입고 재고<select id="source"><option value="">재고 선택</option></select></label>
          <label class="raw-wide">이력번호<input id="lot" maxlength="100" autocomplete="off" placeholder="별도 이력번호 바코드 스캔 또는 직접 입력"></label>
        </div>
      </div></details>
      <form id="scan-form" class="scan-form"><label for="barcode">원료육 박스 바코드</label><div class="scan-input"><input id="barcode" name="barcode" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="300"><button id="scan-submit" class="primary" type="submit">조회</button></div><label class="manual-toggle"><input id="manual-entry" type="checkbox">수기입력</label></form>
      <div class="queue-heading"><h2>스캔 목록 <span id="item-count">0</span></h2><button id="clear-items" type="button">비우기</button></div>
      <ol id="items" class="scan-list"></ol>
      <label class="note-field">비고<input id="note" maxlength="500" autocomplete="off"></label>
    </section>
  </main>
  <footer id="save-bar" hidden><div><strong id="total">0박스 · 0.00 KG</strong><span id="save-detail"></span></div><button id="save" class="primary" type="button" disabled>입고 확인</button></footer>
  <dialog id="raw-review"><h2>라벨 중량 확인</h2><div id="raw-review-message"></div><div id="raw-review-code"></div><label>라벨에 표시된 중량(KG)<input id="raw-review-weight" type="number" min="0.01" max="1000" step="0.01" inputmode="decimal"></label><label class="raw-check"><input id="raw-review-checked" type="checkbox">라벨과 품목·이력번호·중량 대조 완료</label><div class="dialog-actions"><button id="raw-review-cancel" type="button">취소</button><button id="raw-review-add" class="primary" type="button">목록 추가</button></div></dialog>
  <dialog id="confirm-dialog"><h2 id="confirm-title">원료육 입출고 확인</h2><div id="confirm-summary"></div><ul id="confirm-items"></ul><label class="raw-check"><input id="confirm-checked" type="checkbox">라벨과 품목·이력번호·중량 대조 완료</label><div class="dialog-actions"><button id="confirm-cancel" type="button">돌아가기</button><button id="confirm-save" class="primary" type="button" disabled>확정 저장</button></div></dialog>
  <dialog id="history-dialog"><div class="dialog-heading"><h2>원료육 최근 처리이력</h2><button id="history-close" type="button">닫기</button></div><div id="history-list"></div></dialog>
</body>
</html>
