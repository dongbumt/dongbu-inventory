<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>동부엠티 생산현황 보드</title>
  <style>
    :root {
      --bg: #e7e9ec;
      --panel: #f7f7f7;
      --white: #fff;
      --line: #c8ccd1;
      --line-dark: #8b9097;
      --text: #17191c;
      --muted: #656a71;
      --dark: #30343a;
      --dark-2: #454a51;
      --shadow: 0 4px 18px rgba(0, 0, 0, .14);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", "Segoe UI", sans-serif;
      user-select: none;
    }
    button { font: inherit; }

    .board-layout {
      width: 100vw;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(0, 2fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 2fr);
      grid-template-areas:
        "controls whiteboard"
        "calculator whiteboard";
      gap: 8px;
      padding: 8px;
    }

    .control-panel,
    .whiteboard-panel,
    .calculator-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .control-panel {
      grid-area: controls;
      background: #f0f1f2;
    }

    .whiteboard-panel {
      grid-area: whiteboard;
    }

    .toolbar {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      align-content: start;
      gap: 4px;
      padding: 6px;
      overflow: hidden;
      background: #f0f1f2;
    }

    .board-title {
      font-size: clamp(17px, 1.25vw, 23px);
      font-weight: 900;
      letter-spacing: -.4px;
      white-space: nowrap;
    }

    .board-info {
      min-width: 0;
      display: grid;
      gap: 4px;
    }
    .page-controls {
      min-width: 0;
      display: grid;
      grid-template-columns: 44px minmax(78px, 1fr) 44px minmax(106px, 1.1fr);
      gap: 4px;
      align-items: center;
    }
    .date-control {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .board-tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      align-content: start;
    }

    .date-input,
    .page-button,
    .new-page-button {
      min-height: 40px;
      border: 1px solid var(--line-dark);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .date-input { width: 100%; padding: 6px 9px; font-size: 14px; }
    .page-button { min-width: 0; padding: 6px 8px; font-size: 20px; }
    .new-page-button { padding: 6px 12px; font-size: 14px; }
    .page-button:disabled {
      cursor: default;
      opacity: .38;
    }
    .page-indicator {
      min-width: 78px;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
    }

    .tool-button,
    .fullscreen-button {
      min-height: 40px;
      border: 1px solid var(--line-dark);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 6px 10px;
      font-size: clamp(12px, .9vw, 16px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tool-button:hover,
    .fullscreen-button:hover { background: #e5e7e9; }
    .tool-button.active {
      background: var(--dark);
      border-color: var(--dark);
      color: #fff;
    }
    .tool-button.danger { border-style: dashed; }

    .save-status {
      grid-column: 1 / -1;
      min-width: 58px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .sync-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .sync-button {
      min-height: 50px;
      border: 1px solid var(--line-dark);
      border-radius: 9px;
      font: inherit;
      font-weight: 900;
      touch-action: manipulation;
      align-self: end;
      padding: 8px 14px;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      font-size: clamp(14px, 1vw, 18px);
    }
    .sync-button:disabled { opacity: .55; cursor: wait; }
    .sync-status {
      grid-column: 1 / -1;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }
    .sync-status.ok { color: #30343a; }
    .sync-status.error { color: #9b2c2c; }

    .whiteboard-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: var(--white);
      background-image:
        linear-gradient(#f1f1f1 1px, transparent 1px),
        linear-gradient(90deg, #f1f1f1 1px, transparent 1px);
      background-size: 32px 32px;
    }

    #draw-layer,
    #text-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #draw-layer {
      z-index: 1;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    #text-layer {
      z-index: 2;
      resize: none;
      border: 0;
      outline: 0;
      padding: clamp(20px, 2vw, 38px);
      background: transparent;
      color: #111;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: clamp(26px, 2.25vw, 46px);
      font-weight: 800;
      line-height: 1.55;
      letter-spacing: .01em;
      caret-color: #111;
      user-select: text;
      overflow: auto;
    }
    .mode-draw #text-layer { pointer-events: none; }
    .mode-text #draw-layer { pointer-events: none; cursor: default; }

    .calculator-panel {
      grid-area: calculator;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #dfe1e4;
    }

    .calculator-head {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-dark);
      background: #f0f1f2;
    }
    .calculator-title { font-size: clamp(18px, 1.5vw, 26px); font-weight: 900; }
    .clock { color: var(--muted); font-size: clamp(12px, .9vw, 16px); font-weight: 700; white-space: nowrap; }

    .calculator {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(82px, 22%) minmax(0, 1fr);
      gap: 7px;
      padding: 7px;
    }

    .calculator-display {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 14px 16px;
      overflow: hidden;
      border: 2px solid #696e75;
      border-radius: 10px;
      background: #fff;
      box-shadow: inset 0 2px 8px rgba(0,0,0,.1);
    }
    .calculation-line {
      min-height: 24px;
      color: var(--muted);
      font-size: clamp(14px, 1.1vw, 20px);
      font-weight: 700;
      white-space: nowrap;
    }
    .calculation-value {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111;
      font-family: Consolas, "Malgun Gothic", monospace;
      font-size: clamp(40px, 4.3vw, 76px);
      font-weight: 900;
      line-height: 1.08;
      text-align: right;
      white-space: nowrap;
    }

    .keypad {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(42px, 1fr));
      gap: 6px;
    }
    .calc-key {
      min-width: 0;
      min-height: 0;
      border: 1px solid #8b9097;
      border-radius: 10px;
      background: #fff;
      color: #17191c;
      box-shadow: 0 2px 4px rgba(0,0,0,.12);
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: clamp(22px, 2.25vw, 42px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .calc-key:active { transform: translateY(1px); box-shadow: none; }
    .calc-key.utility { background: #cfd2d6; }
    .calc-key.operator { background: var(--dark-2); color: #fff; }
    .calc-key.equals { background: var(--dark); color: #fff; }
    .calc-key.zero { grid-column: span 2; }

    @media (max-width: 980px) {
      html, body { overflow: auto; }
      .board-layout {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(70dvh, 760px) minmax(70dvh, 720px);
        grid-template-areas:
          "controls"
          "whiteboard"
          "calculator";
      }
      .control-panel { min-height: 250px; }
      .toolbar { height: auto; }
      .calculator { grid-template-rows: 150px minmax(520px, 1fr); }
    }

    @media (max-height: 720px) and (min-width: 981px) {
      .toolbar { gap: 2px; padding: 3px 5px; }
      .calculator-head { padding-top: 4px; padding-bottom: 4px; }
      .board-title { font-size: 15px; line-height: 18px; }
      .board-info, .page-controls, .board-tools { gap: 2px; }
      .tool-button, .fullscreen-button, .date-input, .page-button, .new-page-button { min-height: 31px; padding-top: 3px; padding-bottom: 3px; }
      .tool-button, .new-page-button, .date-input, .page-indicator { font-size: 12px; }
      .sync-panel { gap: 3px; margin-top: 1px; padding-top: 3px; }
      .sync-button { min-height: 37px; }
      .sync-status, .save-status { min-height: 12px; font-size: 9px; line-height: 12px; }
      .calculator { gap: 5px; padding: 5px; grid-template-rows: minmax(74px, 20%) minmax(0, 1fr); }
      .keypad { gap: 4px; grid-template-rows: repeat(5, minmax(36px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="board-layout">
    <section class="control-panel">
      <header class="toolbar">
        <div class="board-info">
          <div class="board-title">생산현황 화이트보드</div>
          <div class="page-controls">
            <label class="date-control">일자 <input class="date-input" id="board-date" type="date" aria-label="화이트보드 일자"></label>
            <button class="page-button" id="previous-page" type="button" aria-label="이전 페이지">‹</button>
            <span class="page-indicator" id="page-indicator">1 / 1 페이지</span>
            <button class="page-button" id="next-page" type="button" aria-label="다음 페이지">›</button>
            <button class="new-page-button" id="new-page" type="button">＋ 새 페이지</button>
          </div>
        </div>
        <div class="board-tools">
          <button class="tool-button active" type="button" data-mode="text">⌨ 글자 입력</button>
          <button class="tool-button" type="button" data-mode="pen">✎ 터치 펜</button>
          <button class="tool-button" type="button" data-mode="eraser">▱ 지우개</button>
          <button class="tool-button danger" id="clear-board" type="button">현재 페이지 지우기</button>
          <span class="save-status" id="save-status">자동 저장</span>
        </div>
        <div class="sync-panel">
          <button class="sync-button" id="sync-board" type="button">💾 저장 · ERP 전송</button>
          <span class="sync-status" id="sync-status">라벨전용 로그인 상태를 확인하고 있습니다.</span>
        </div>
      </header>
    </section>

    <section class="whiteboard-panel">
      <div class="whiteboard-stage mode-text" id="whiteboard-stage">
        <canvas id="draw-layer" aria-label="터치 펜 입력 영역"></canvas>
        <textarea id="text-layer" aria-label="생산현황 글자 입력"></textarea>
      </div>
    </section>

    <aside class="calculator-panel">
      <header class="calculator-head">
        <div>
          <div class="calculator-title">큰 계산기</div>
          <div class="clock" id="clock"></div>
        </div>
        <button class="fullscreen-button" id="fullscreen-button" type="button">⛶ 전체화면</button>
      </header>
      <section class="calculator" aria-label="계산기">
        <div class="calculator-display" aria-live="polite">
          <div class="calculation-line" id="calculation-line"></div>
          <div class="calculation-value" id="calculation-value">0</div>
        </div>
        <div class="keypad">
          <button class="calc-key utility" type="button" data-key="clear">AC</button>
          <button class="calc-key utility" type="button" data-key="sign">±</button>
          <button class="calc-key utility" type="button" data-key="percent">%</button>
          <button class="calc-key operator" type="button" data-key="divide">÷</button>

          <button class="calc-key" type="button" data-key="7">7</button>
          <button class="calc-key" type="button" data-key="8">8</button>
          <button class="calc-key" type="button" data-key="9">9</button>
          <button class="calc-key operator" type="button" data-key="multiply">×</button>

          <button class="calc-key" type="button" data-key="4">4</button>
          <button class="calc-key" type="button" data-key="5">5</button>
          <button class="calc-key" type="button" data-key="6">6</button>
          <button class="calc-key operator" type="button" data-key="subtract">−</button>

          <button class="calc-key" type="button" data-key="1">1</button>
          <button class="calc-key" type="button" data-key="2">2</button>
          <button class="calc-key" type="button" data-key="3">3</button>
          <button class="calc-key operator" type="button" data-key="add">+</button>

          <button class="calc-key zero" type="button" data-key="0">0</button>
          <button class="calc-key" type="button" data-key="decimal">.</button>
          <button class="calc-key equals" type="button" data-key="equals">=</button>
        </div>
      </section>
    </aside>
  </main>

  <script>
    (() => {
      'use strict';

      const LEGACY_TEXT_KEY = 'dbmt_production_board_text_v1';
      const LEGACY_DRAW_KEY = 'dbmt_production_board_drawing_v1';
      const INDEX_KEY = 'dbmt_production_board_index_v2';
      const PAGE_PREFIX = 'dbmt_production_board_page_v2_';
      const LAST_DATE_KEY = 'dbmt_production_board_last_date_v2';
      const MIGRATION_KEY = 'dbmt_production_board_migrated_v2';
      const LABEL_SESSION_KEY = 'dbmt_label_print_session_v1';
      const SUPABASE_URL = 'https://hdwjwtmbsxfjrlvicgnn.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_40Sg1P9a5KKA-2pXtzXJZA_qSXDqPZg';
      const stage = document.getElementById('whiteboard-stage');
      const canvas = document.getElementById('draw-layer');
      const textLayer = document.getElementById('text-layer');
      const saveStatus = document.getElementById('save-status');
      const boardDateInput = document.getElementById('board-date');
      const pageIndicator = document.getElementById('page-indicator');
      const previousPageButton = document.getElementById('previous-page');
      const nextPageButton = document.getElementById('next-page');
      const syncButton = document.getElementById('sync-board');
      const syncStatus = document.getElementById('sync-status');
      const ctx = canvas.getContext('2d', {alpha: true});

      let boardMode = 'text';
      let drawing = false;
      let previousPoint = null;
      let saveTimer = null;
      let drawingSnapshot = '';
      let paintGeneration = 0;
      let boardIndex = {};
      let activeDate = '';
      let activePageIndex = 0;
      let activePageId = '';

      function setSaveStatus(message){
        saveStatus.textContent = message;
        clearTimeout(setSaveStatus.timer);
        setSaveStatus.timer = setTimeout(() => { saveStatus.textContent = '자동 저장'; }, 1400);
      }

      function setSyncStatus(message, type = ''){
        syncStatus.textContent = message;
        syncStatus.className = `sync-status ${type}`.trim();
      }

      function markSyncPending(){
        setSyncStatus('현재 페이지에 변경사항이 있어 ERP 재전송이 필요합니다.');
      }

      function clearLabelSession(){
        try { localStorage.removeItem(LABEL_SESSION_KEY); } catch(_) {}
        try {
          const secure = location.protocol === 'https:' ? '; Secure' : '';
          document.cookie = `${LABEL_SESSION_KEY}=; Path=/; Max-Age=0; SameSite=Strict${secure}`;
        } catch(_) {}
      }

      function readLabelSessionToken(){
        try {
          const session = JSON.parse(localStorage.getItem(LABEL_SESSION_KEY) || '{}');
          const token = typeof session.token === 'string' ? session.token : '';
          if(/^[a-f0-9]{64}$/i.test(token)) return token;
        } catch(_) {}

        try {
          const prefix = `${LABEL_SESSION_KEY}=`;
          const item = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix));
          const token = item ? decodeURIComponent(item.slice(prefix.length)) : '';
          if(/^[a-f0-9]{64}$/i.test(token)) return token;
        } catch(_) {}

        return '';
      }

      function setLabelSessionStatus(){
        setSyncStatus(readLabelSessionToken()
          ? '라벨전용 로그인 연결됨 · 버튼을 누르면 바로 ERP로 전송됩니다.'
          : '라벨전용 화면에서 먼저 로그인한 뒤 전송해주세요.');
      }

      function localDateString(date){
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function createPageId(){
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function pageStorageKey(date, pageId){
        return `${PAGE_PREFIX}${date}_${pageId}`;
      }

      function readBoardIndex(){
        try {
          const parsed = JSON.parse(localStorage.getItem(INDEX_KEY) || '{}');
          return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
        } catch(_) {
          return {};
        }
      }

      function writeBoardIndex(){
        localStorage.setItem(INDEX_KEY, JSON.stringify(boardIndex));
      }

      function ensureDatePages(date){
        if(!Array.isArray(boardIndex[date]) || boardIndex[date].length === 0){
          boardIndex[date] = [createPageId()];
          writeBoardIndex();
        }
        return boardIndex[date];
      }

      function readPage(date, pageId){
        try {
          const parsed = JSON.parse(localStorage.getItem(pageStorageKey(date, pageId)) || '{}');
          return {
            text: typeof parsed.text === 'string' ? parsed.text : '',
            drawing: typeof parsed.drawing === 'string' ? parsed.drawing : ''
          };
        } catch(_) {
          return {text: '', drawing: ''};
        }
      }

      function persistCurrentPage({captureDrawing = true, showStatus = true} = {}){
        if(!activeDate || !activePageId) return false;
        clearTimeout(saveTimer);
        try {
          if(captureDrawing && canvas.dataset.ready === 'true'){
            drawingSnapshot = canvas.toDataURL('image/png');
          }
          localStorage.setItem(pageStorageKey(activeDate, activePageId), JSON.stringify({
            text: textLayer.value,
            drawing: drawingSnapshot,
            updatedAt: new Date().toISOString()
          }));
          if(showStatus) setSaveStatus('저장됨');
          return true;
        } catch(_) {
          if(showStatus) setSaveStatus('저장 실패');
          return false;
        }
      }

      function currentPagePayload(){
        const rect = stage.getBoundingClientRect();
        const style = getComputedStyle(textLayer);
        return {
          boardDate: activeDate,
          pageNo: activePageIndex + 1,
          pageId: activePageId,
          text: textLayer.value,
          drawing: drawingSnapshot,
          sourceWidth: Math.max(100, Math.round(rect.width)),
          sourceHeight: Math.max(100, Math.round(rect.height)),
          textFontSize: Math.max(8, parseFloat(style.fontSize) || 36),
          textLineHeight: Math.max(8, parseFloat(style.lineHeight) || 56),
          textPadding: Math.max(0, parseFloat(style.paddingTop) || 0)
        };
      }

      async function boardRpc(functionName, body){
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_PUBLISHABLE_KEY,
            Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body || {})
        });
        const raw = await response.text();
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch(_) { data = raw; }
        if(!response.ok){
          throw new Error(data?.message || data?.error || raw || 'ERP 전송에 실패했습니다.');
        }
        return data;
      }

      async function syncCurrentPage(){
        const sessionToken = readLabelSessionToken();
        if(!sessionToken){
          setSyncStatus('라벨전용 화면에서 먼저 로그인해주세요.', 'error');
          return;
        }

        syncButton.disabled = true;
        setSyncStatus('현재 페이지를 저장하고 ERP로 전송하는 중입니다.');
        try {
          if(!persistCurrentPage({captureDrawing: true, showStatus: true})){
            throw new Error('이 컴퓨터에 페이지를 저장하지 못했습니다.');
          }
          const result = await boardRpc('dbmt_label_production_board_save_session', {
            p_session_token: sessionToken,
            p_page: currentPagePayload()
          });
          const sentAt = result?.updatedAt ? new Date(result.updatedAt) : new Date();
          const time = Number.isNaN(sentAt.getTime())
            ? ''
            : ` · ${String(sentAt.getHours()).padStart(2, '0')}:${String(sentAt.getMinutes()).padStart(2, '0')}`;
          setSyncStatus(`${activeDate} ${activePageIndex + 1}페이지 ERP 전송 완료${time}`, 'ok');
        } catch(error) {
          if(String(error?.message || error).includes('로그인')){
            clearLabelSession();
          }
          setSyncStatus(`ERP 전송 실패: ${error.message || error}`, 'error');
        } finally {
          syncButton.disabled = false;
        }
      }

      function saveTextSoon(){
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          persistCurrentPage({captureDrawing: false});
        }, 250);
      }

      function saveDrawing(){
        try {
          drawingSnapshot = canvas.toDataURL('image/png');
          persistCurrentPage({captureDrawing: false});
        } catch(_) {
          setSaveStatus('저장 실패');
        }
      }

      function updatePageControls(){
        const pages = ensureDatePages(activeDate);
        pageIndicator.textContent = `${activePageIndex + 1} / ${pages.length} 페이지`;
        previousPageButton.disabled = activePageIndex <= 0;
        nextPageButton.disabled = activePageIndex >= pages.length - 1;
      }

      function loadActivePage(){
        const pages = ensureDatePages(activeDate);
        activePageIndex = Math.max(0, Math.min(activePageIndex, pages.length - 1));
        activePageId = pages[activePageIndex];
        const page = readPage(activeDate, activePageId);
        textLayer.value = page.text;
        drawingSnapshot = page.drawing;
        resizeCanvas(false);
        updatePageControls();
        setSaveStatus('불러옴');
        setLabelSessionStatus();
        if(boardMode === 'text') setTimeout(() => textLayer.focus(), 0);
      }

      function switchPage(nextIndex){
        const pages = ensureDatePages(activeDate);
        const safeIndex = Math.max(0, Math.min(nextIndex, pages.length - 1));
        if(safeIndex === activePageIndex) return;
        persistCurrentPage({showStatus: false});
        activePageIndex = safeIndex;
        loadActivePage();
      }

      function switchDate(date){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
          boardDateInput.value = activeDate;
          return;
        }
        if(activeDate) persistCurrentPage({showStatus: false});
        activeDate = date;
        activePageIndex = 0;
        boardDateInput.value = date;
        try { localStorage.setItem(LAST_DATE_KEY, date); } catch(_) {}
        ensureDatePages(date);
        loadActivePage();
      }

      function createNewPage(){
        persistCurrentPage({showStatus: false});
        try {
          const pages = ensureDatePages(activeDate);
          pages.push(createPageId());
          writeBoardIndex();
          activePageIndex = pages.length - 1;
          loadActivePage();
          setSaveStatus('새 페이지');
        } catch(_) {
          setSaveStatus('추가 실패');
        }
      }

      function migrateLegacyBoard(today){
        try {
          if(localStorage.getItem(MIGRATION_KEY)) return;
          const legacyText = localStorage.getItem(LEGACY_TEXT_KEY) || '';
          const legacyDrawing = localStorage.getItem(LEGACY_DRAW_KEY) || '';
          if((legacyText || legacyDrawing) && (!Array.isArray(boardIndex[today]) || boardIndex[today].length === 0)){
            const pageId = createPageId();
            boardIndex[today] = [pageId];
            writeBoardIndex();
            localStorage.setItem(pageStorageKey(today, pageId), JSON.stringify({
              text: legacyText,
              drawing: legacyDrawing,
              updatedAt: new Date().toISOString()
            }));
          }
          localStorage.setItem(MIGRATION_KEY, '1');
        } catch(_) {}
      }

      function paintSnapshot(dataUrl, targetWidth, targetHeight){
        const generation = ++paintGeneration;
        if(!dataUrl) return;
        const img = new Image();
        img.onload = () => {
          if(generation !== paintGeneration) return;
          const dpr = canvas.width / Math.max(targetWidth, 1);
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
          ctx.restore();
        };
        img.src = dataUrl;
      }

      function resizeCanvas(preserveCurrent = true){
        const rect = stage.getBoundingClientRect();
        if(!rect.width || !rect.height) return;
        let current = drawingSnapshot;
        try {
          if(preserveCurrent && canvas.dataset.ready === 'true') current = canvas.toDataURL('image/png');
        } catch(_) {}
        drawingSnapshot = current;
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        canvas.dataset.ready = 'true';
        paintSnapshot(current, rect.width, rect.height);
      }

      function pointFromEvent(event){
        const rect = canvas.getBoundingClientRect();
        return {x: event.clientX - rect.left, y: event.clientY - rect.top};
      }

      function beginStroke(event){
        if(boardMode === 'text') return;
        event.preventDefault();
        drawing = true;
        previousPoint = pointFromEvent(event);
        markSyncPending();
        canvas.setPointerCapture?.(event.pointerId);
      }

      function continueStroke(event){
        if(!drawing || !previousPoint) return;
        event.preventDefault();
        const point = pointFromEvent(event);
        ctx.save();
        ctx.globalCompositeOperation = boardMode === 'eraser' ? 'destination-out' : 'source-over';
        ctx.strokeStyle = '#111';
        ctx.lineWidth = boardMode === 'eraser' ? 38 : 5;
        ctx.beginPath();
        ctx.moveTo(previousPoint.x, previousPoint.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        ctx.restore();
        previousPoint = point;
      }

      function endStroke(event){
        if(!drawing) return;
        drawing = false;
        previousPoint = null;
        try { canvas.releasePointerCapture?.(event.pointerId); } catch(_) {}
        saveDrawing();
      }

      function setBoardMode(mode){
        boardMode = mode;
        stage.classList.toggle('mode-text', mode === 'text');
        stage.classList.toggle('mode-draw', mode !== 'text');
        document.querySelectorAll('[data-mode]').forEach(button => {
          button.classList.toggle('active', button.dataset.mode === mode);
        });
        canvas.style.cursor = mode === 'eraser' ? 'cell' : 'crosshair';
        if(mode === 'text') setTimeout(() => textLayer.focus(), 0);
      }

      document.querySelectorAll('[data-mode]').forEach(button => {
        button.addEventListener('click', () => setBoardMode(button.dataset.mode));
      });
      boardDateInput.addEventListener('change', () => switchDate(boardDateInput.value));
      previousPageButton.addEventListener('click', () => switchPage(activePageIndex - 1));
      nextPageButton.addEventListener('click', () => switchPage(activePageIndex + 1));
      document.getElementById('new-page').addEventListener('click', createNewPage);
      syncButton.addEventListener('click', syncCurrentPage);
      document.getElementById('clear-board').addEventListener('click', () => {
        if(!confirm('현재 페이지의 글자와 그림을 모두 지울까요?')) return;
        textLayer.value = '';
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        drawingSnapshot = '';
        persistCurrentPage({captureDrawing: false});
        setSaveStatus('현재 페이지 지움');
        markSyncPending();
      });
      textLayer.addEventListener('input', () => {
        markSyncPending();
        saveTextSoon();
      });
      canvas.addEventListener('pointerdown', beginStroke);
      canvas.addEventListener('pointermove', continueStroke);
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      window.addEventListener('resize', () => {
        clearTimeout(resizeCanvas.timer);
        resizeCanvas.timer = setTimeout(resizeCanvas, 120);
      });
      window.addEventListener('focus', setLabelSessionStatus);
      window.addEventListener('storage', event => {
        if(event.key === LABEL_SESSION_KEY) setLabelSessionStatus();
      });
      window.addEventListener('beforeunload', () => persistCurrentPage({showStatus: false}));

      boardIndex = readBoardIndex();
      const today = localDateString(new Date());
      migrateLegacyBoard(today);
      let initialDate = today;
      try {
        const rememberedDate = localStorage.getItem(LAST_DATE_KEY) || '';
        if(/^\d{4}-\d{2}-\d{2}$/.test(rememberedDate)) initialDate = rememberedDate;
      } catch(_) {}
      switchDate(initialDate);

      const display = document.getElementById('calculation-value');
      const expression = document.getElementById('calculation-line');
      let currentValue = '0';
      let storedValue = null;
      let pendingOperator = null;
      let waitingForValue = false;

      const operatorSymbol = {add: '+', subtract: '−', multiply: '×', divide: '÷'};

      function normalizedResult(value){
        if(!Number.isFinite(value)) return '오류';
        return Number(value.toPrecision(12)).toString();
      }

      function displayNumber(value){
        if(value === '오류') return value;
        const negative = value.startsWith('-');
        const raw = negative ? value.slice(1) : value;
        const [integerPart, decimalPart] = raw.split('.');
        const integer = Number(integerPart || 0).toLocaleString('ko-KR');
        return `${negative ? '-' : ''}${integer}${decimalPart !== undefined ? '.' + decimalPart : ''}`;
      }

      function updateCalculator(){
        display.textContent = displayNumber(currentValue);
        expression.textContent = pendingOperator && storedValue !== null
          ? `${displayNumber(String(storedValue))} ${operatorSymbol[pendingOperator]}`
          : '';
      }

      function inputDigit(digit){
        if(currentValue === '오류' || waitingForValue){
          currentValue = digit;
          waitingForValue = false;
        } else if(currentValue === '0') {
          currentValue = digit;
        } else if(currentValue.replace(/[-.]/g, '').length < 14) {
          currentValue += digit;
        }
        updateCalculator();
      }

      function inputDecimal(){
        if(currentValue === '오류' || waitingForValue){
          currentValue = '0.';
          waitingForValue = false;
        } else if(!currentValue.includes('.')) {
          currentValue += '.';
        }
        updateCalculator();
      }

      function applyOperation(left, right, operator){
        if(operator === 'add') return left + right;
        if(operator === 'subtract') return left - right;
        if(operator === 'multiply') return left * right;
        if(operator === 'divide') return right === 0 ? NaN : left / right;
        return right;
      }

      function chooseOperator(operator){
        if(currentValue === '오류') clearCalculator();
        const input = Number(currentValue);
        if(pendingOperator && storedValue !== null && !waitingForValue){
          currentValue = normalizedResult(applyOperation(storedValue, input, pendingOperator));
          storedValue = currentValue === '오류' ? null : Number(currentValue);
        } else {
          storedValue = input;
        }
        pendingOperator = currentValue === '오류' ? null : operator;
        waitingForValue = true;
        updateCalculator();
      }

      function calculate(){
        if(!pendingOperator || storedValue === null || currentValue === '오류') return;
        currentValue = normalizedResult(applyOperation(storedValue, Number(currentValue), pendingOperator));
        storedValue = null;
        pendingOperator = null;
        waitingForValue = true;
        updateCalculator();
      }

      function clearCalculator(){
        currentValue = '0';
        storedValue = null;
        pendingOperator = null;
        waitingForValue = false;
        updateCalculator();
      }

      function handleCalculatorKey(key){
        if(/^\d$/.test(key)) return inputDigit(key);
        if(key === 'decimal') return inputDecimal();
        if(key === 'add' || key === 'subtract' || key === 'multiply' || key === 'divide') return chooseOperator(key);
        if(key === 'equals') return calculate();
        if(key === 'clear') return clearCalculator();
        if(key === 'sign'){
          if(currentValue !== '0' && currentValue !== '오류') currentValue = currentValue.startsWith('-') ? currentValue.slice(1) : '-' + currentValue;
          return updateCalculator();
        }
        if(key === 'percent'){
          if(currentValue !== '오류') currentValue = normalizedResult(Number(currentValue) / 100);
          return updateCalculator();
        }
      }

      document.querySelectorAll('.calc-key').forEach(button => {
        button.addEventListener('click', () => handleCalculatorKey(button.dataset.key));
      });

      document.addEventListener('keydown', event => {
        if(document.activeElement === textLayer) return;
        const map = {'+':'add','-':'subtract','*':'multiply','/':'divide','Enter':'equals','=':'equals','.':'decimal',',':'decimal','Escape':'clear','Delete':'clear'};
        if(/^\d$/.test(event.key)){
          event.preventDefault();
          inputDigit(event.key);
        } else if(map[event.key]){
          event.preventDefault();
          handleCalculatorKey(map[event.key]);
        } else if(event.key === 'Backspace'){
          event.preventDefault();
          if(currentValue !== '오류' && !waitingForValue){
            currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
            updateCalculator();
          }
        }
      });

      const fullscreenButton = document.getElementById('fullscreen-button');
      fullscreenButton.addEventListener('click', async () => {
        try {
          if(document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch(_) {
          alert('전체화면 전환이 차단되었습니다. 키보드의 F11을 눌러주세요.');
        }
      });
      document.addEventListener('fullscreenchange', () => {
        fullscreenButton.textContent = document.fullscreenElement ? '⛶ 전체화면 종료' : '⛶ 전체화면';
        setTimeout(resizeCanvas, 100);
      });

      function updateClock(){
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleString('ko-KR', {
          month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'
        });
      }
      updateClock();
      setInterval(updateClock, 1000);
      updateCalculator();
    })();
  </script>
</body>
</html>
