<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a252f">
  <title>동부엠티 냉동창고 요청</title>
  <link rel="stylesheet" href="styles/main.css?v=20260813a">
  <link rel="stylesheet" href="styles/cold-storage-request.css?v=20260813d">
  <link rel="stylesheet" href="styles/cold-storage-standalone.css?v=20260813b">
</head>
<body class="csr-standalone-body">
  <header class="csr-public-header">
    <div class="csr-public-brand">
      <span class="csr-public-logo" aria-hidden="true">DB</span>
      <div>
        <div class="csr-public-eyebrow">DONGBUMT ERP</div>
        <h1>냉동창고 요청</h1>
      </div>
    </div>
    <button type="button" id="csr-public-connection" class="csr-public-connection" onclick="requestColdStoragePublicAccess()" title="서버 연결 다시 시도">서버 연결 중</button>
  </header>

  <main class="csr-public-main">
    <div class="tab-panel active" id="p-cold-storage-request">
      <div class="csr-page-grid">
        <section class="card csr-editor-card">
          <div class="section-header csr-section-header">
            <div class="card-title" style="margin:0;"><div class="ct-bar" style="background:#56606f;"></div>냉동창고 출고·이체 요청</div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="newColdStorageRequest()">새 요청</button>
          </div>

          <div class="csr-meta-grid">
            <div class="form-group">
              <label>요청 구분</label>
              <div class="csr-segment" role="group" aria-label="요청 구분">
                <button type="button" id="csr-type-out" onclick="setColdStorageRequestType('출고')">출고</button>
                <button type="button" id="csr-type-transfer" onclick="setColdStorageRequestType('이체')">이체</button>
              </div>
            </div>
            <div class="form-group"><label>요청일</label><input id="csr-date" type="date" onchange="coldStorageRequestMetaChanged('requestDate',this.value)"></div>
            <div class="form-group csr-wide-field">
              <label>발신 프로필</label>
              <select id="csr-sender-profile" onchange="coldStorageSenderProfileChanged(this.value)">
                <option value="dongbumt">팩스 발신 1 (동부엠티)</option>
                <option value="dongbu_distribution">팩스 발신 2 (기존 동부축산유통)</option>
              </select>
            </div>
            <div class="form-group csr-wide-field">
              <label>수신 냉동창고</label>
              <div class="csr-warehouse-picker-shell">
                <input id="csr-warehouse" placeholder="냉동창고 선택 또는 입력" autocomplete="off" role="combobox" aria-haspopup="listbox" aria-expanded="false" onpointerdown="coldStorageWarehousePointerdown(event)" onfocus="openColdStorageWarehousePicker()" onclick="openColdStorageWarehousePicker()" onchange="coldStorageWarehouseChanged(this.value)" oninput="coldStorageWarehouseQueryChanged(this.value)" onkeydown="coldStorageWarehouseKeydown(event)">
                <button type="button" class="csr-warehouse-open-button" onclick="openColdStorageWarehousePicker()" title="냉동창고 목록 열기" aria-label="냉동창고 목록 열기">⌄</button>
                <div id="csr-warehouse-backdrop" class="csr-warehouse-backdrop" onclick="closeColdStorageWarehousePicker()"></div>
                <div id="csr-warehouse-picker" class="csr-warehouse-picker" role="dialog" aria-label="냉동창고 선택">
                  <div class="csr-warehouse-picker-header"><strong>냉동창고 선택</strong><button type="button" onclick="closeColdStorageWarehousePicker()" title="닫기" aria-label="닫기">×</button></div>
                  <input id="csr-warehouse-search" class="csr-warehouse-search" type="search" placeholder="냉동창고명 검색" autocomplete="off" oninput="coldStorageWarehouseSearchChanged(this.value)" onkeydown="coldStorageWarehouseKeydown(event)">
                  <div id="csr-warehouse-options" class="csr-warehouse-options" role="listbox"></div>
                  <button type="button" id="csr-warehouse-manual" class="csr-warehouse-manual" onclick="useManualColdStorageWarehouse()" hidden>직접 입력</button>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>수신 팩스번호</label>
              <input id="csr-fax" list="csr-fax-list" type="tel" inputmode="tel" placeholder="예) 031-000-0000" oninput="coldStorageRequestMetaChanged('fax',this.value)">
              <datalist id="csr-fax-list"></datalist>
            </div>
            <div class="form-group">
              <label>담당자</label>
              <select id="csr-manager" onchange="coldStorageManagerChanged(this.value)">
                <option value="배은정 실장">배은정 실장</option>
                <option value="김상영 본부장">김상영 본부장</option>
              </select>
            </div>
            <div class="form-group"><label>담당자 연락처</label><input id="csr-manager-phone" type="tel" readonly></div>
            <div class="form-group csr-note-field"><label>요청사항</label><input id="csr-note" placeholder="필요한 추가 요청사항을 입력하세요" oninput="coldStorageRequestMetaChanged('note',this.value)"></div>
          </div>

          <div class="csr-items-heading">
            <strong>요청 품목</strong>
            <button type="button" class="btn btn-secondary btn-sm" onclick="addColdStorageRequestItem()">+ 품목 추가</button>
          </div>
          <datalist id="csr-unit-list"><option value="BOX"></option><option value="KG"></option><option value="EA"></option><option value="PALLET"></option></datalist>
          <div class="tbl-wrap csr-items-wrap">
            <table class="csr-items-table">
              <thead><tr>
                <th style="width:36px;">No.</th><th id="csr-destination-head">출고처</th><th>품명</th>
                <th style="width:82px;">단위</th><th style="width:96px;text-align:right;">수량</th><th>B/L·LOT</th><th>비고</th><th style="width:42px;"></th>
              </tr></thead>
              <tbody id="csr-item-body"></tbody>
            </table>
          </div>
          <div class="csr-editor-actions">
            <span id="csr-save-state" class="csr-save-state"></span>
            <button type="button" class="btn btn-secondary" onclick="printColdStorageRequest()">인쇄</button>
            <button type="button" class="btn btn-secondary" onclick="downloadColdStorageRequestImage()">이미지 저장</button>
            <button type="button" class="btn btn-primary" onclick="saveColdStorageRequest()">저장</button>
            <button type="button" class="btn csr-fax-button" id="csr-fax-button" onclick="sendColdStorageRequestFax()">바로빌 팩스</button>
          </div>
          <div id="csr-fax-config" class="csr-config-message" style="display:none;"></div>
        </section>

        <section class="card csr-preview-card">
          <div class="section-header csr-section-header">
            <div class="card-title" style="margin:0;"><div class="ct-bar" style="background:#7b8491;"></div>A4 요청서 미리보기</div>
            <span id="csr-preview-label" class="csr-preview-label">출고 요청서</span>
          </div>
          <div class="csr-preview-stage">
            <canvas id="csr-preview-canvas" width="1240" height="1754" aria-label="냉동창고 요청서 미리보기"></canvas>
          </div>
        </section>
      </div>

      <section class="card csr-history-card">
        <div class="section-header csr-section-header">
          <div class="card-title" style="margin:0;"><div class="ct-bar" style="background:#56606f;"></div>요청 및 팩스 이력</div>
          <div class="csr-history-filters">
            <input id="csr-history-from" type="date" onchange="renderColdStorageRequestHistory()" title="시작일">
            <span>~</span>
            <input id="csr-history-to" type="date" onchange="renderColdStorageRequestHistory()" title="종료일">
            <input id="csr-history-search" type="search" placeholder="냉동창고·출고처·품목 검색" oninput="renderColdStorageRequestHistory()">
            <button type="button" class="btn btn-secondary btn-sm" id="csr-status-refresh-button" onclick="refreshColdStorageFaxStatuses()">팩스 상태 새로고침</button>
            <span id="csr-history-count"></span>
          </div>
        </div>
        <div class="tbl-wrap csr-history-wrap">
          <table class="csr-history-table">
            <thead><tr>
              <th>요청일</th><th>구분</th><th>발신 프로필</th><th>냉동창고</th><th>요청내용</th>
              <th style="text-align:right;">총수량</th><th>팩스번호</th><th>상태</th><th>관리</th>
            </tr></thead>
            <tbody id="csr-history-body"><tr><td colspan="9" class="csr-empty-cell">서버 데이터를 불러오는 중입니다.</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <div id="csr-public-toast" class="csr-public-toast" role="status" aria-live="polite"></div>

  <script src="cold-storage-standalone.js?v=20260813a"></script>
  <script src="company-master.js?v=20260827requiredlogin1"></script>
  <script src="cold-storage-request.js?v=20260827requiredlogin1"></script>
</body>
</html>
